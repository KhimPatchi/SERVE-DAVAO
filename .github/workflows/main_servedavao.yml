# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - ServeDavao

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
        env:
          VITE_REVERB_APP_KEY: "swp6nd0v3v9z7x4y1r2q"
          VITE_REVERB_HOST: "servedavao-bdeqbfftf9cwaxhy.eastasia-01.azurewebsites.net"
          VITE_REVERB_PORT: "443"
          VITE_REVERB_SCHEME: "https"
          VITE_APP_NAME: "ServeDavao"

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Clean up node_modules and development files
        run: |
          rm -rf node_modules
          rm -rf .git
          rm -rf .github

      - name: Zip artifact for deployment
        run: zip -r php-app.zip . --exclude "*.zip"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: php-app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_11150DEB29154451959710E5B30C8143 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7E11AE02732D4FC590A2605F74A8F550 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6C183406893E4B408DB90755A73F7B85 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ServeDavao'
          slot-name: 'Production'
          package: php-app.zip
